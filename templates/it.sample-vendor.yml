# Sample header template for an Italian wholesale invoice, in invoice2data format.
#
# SYNTHETIC EXAMPLE. The issuer below is invented. It exists to show the shape
# of an EU invoice template and nothing else — do not point it at a real
# supplier without reading their own document first. A public repository has no
# business naming a real counterparty, so this one deliberately does not.
#
# To onboard a real vendor: copy this file to <vendor>.yml, set `issuer` to
# their legal name, and adjust each regex against
#   pdftotext -layout <their-invoice>.pdf -
# See docs/OPERATIONS.md for the procedure and the traps.
issuer: Sample Vendor S.r.l.
keywords:
  - Sample Vendor
  - N° Documento
fields:
  invoice_number: 'N° Documento\s*:?\s*(\S+)'
  date: 'Data Emissione\s*:?\s*(\d{2}/\d{2}/\d{4})'
  amount: 'Totale Documento[\s\S]{0,400}?(\d{1,3}(?:\.\d{3})*,\d{2})'
  vat_number: 'P\. I\.V\.A\.:\s*(IT\d{11})'
options:
  currency: EUR
  date_formats:
    - '%d/%m/%Y'
  decimal_separator: ','
  languages:
    - it
